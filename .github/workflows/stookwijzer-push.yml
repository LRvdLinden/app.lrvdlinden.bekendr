name: Stookwijzer pushmeldingen

on:
  schedule:
    # Elk uur op minuut 7 (UTC). GitHub kan geplande runs enkele minuten vertragen.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen loggen, niets versturen"
        type: boolean
        default: false
      test_token:
        description: "Optioneel: stuur één testmelding naar dit device-token"
        type: string
        default: ""
      test_env:
        description: "Omgeving voor de testmelding"
        type: choice
        options: [sandbox, production]
        default: sandbox

concurrency:
  group: stookwijzer-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Worker-URL en admin-token bepalen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare-secrets nog niet ingesteld, overslaan"; exit 0
          fi
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          ADMIN=$(printf '%s' "stookwijzer:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$ADMIN"
          echo "WORKER_URL=https://stookwijzer-push.$SUB.workers.dev" >> "$GITHUB_ENV"
          echo "WORKER_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"

      - name: Advies controleren en meldingen versturen
        run: node scripts/send-push.mjs
        env:
          APN_TEAM_ID: ${{ secrets.APN_TEAM_ID }}
          APN_KEY_ID: ${{ secrets.APN_KEY_ID }}
          APN_P8_CERT: ${{ secrets.APN_P8_CERT }}
          APN_TOPIC: nl.lrvdlinden.stookwijzer
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_TOKEN: ${{ inputs.test_token }}
          TEST_ENV: ${{ inputs.test_env }}
