name: Deploy meldingsserver (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "server/worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write   # om de Worker-URL in de app bij te werken

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: stookwijzer-push
      KV_TITLE: stookwijzer-push-subscriptions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Secrets controleren
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN ontbreekt"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID ontbreekt"; exit 1; }

      - name: KV-namespace zoeken of aanmaken
        id: kv
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"title\":\"$KV_TITLE\"}" "$API" | jq -r '.result.id')
            echo "KV-namespace aangemaakt"
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::KV-namespace niet gevonden/aangemaakt"; exit 1; }
          sed -i "s/^id = .*/id = \"$ID\"/" server/worker/wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: workers.dev-subdomein controleren of aanmaken
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          SUB=$(curl -sS -H "$AUTH" "$API" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for NAME in lrvdlinden lrvdlinden-apps lrvdlinden-$(date +%s); do
              OK=$(curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
                --data "{\"subdomain\":\"$NAME\"}" "$API" | jq -r '.success')
              if [ "$OK" = "true" ]; then SUB=$NAME; echo "Subdomein $NAME.workers.dev aangemaakt"; break; fi
            done
          fi
          [ -n "$SUB" ] || { echo "::error::Kon geen workers.dev-subdomein aanmaken"; exit 1; }
          echo "Subdomein: $SUB.workers.dev"

      - name: Worker deployen
        working-directory: server/worker
        run: npx --yes wrangler@4 deploy

      - name: Admin-token als Worker-secret zetten
        working-directory: server/worker
        run: |
          # Afgeleid van het Cloudflare-token, zodat je geen extra secret hoeft te maken.
          ADMIN_TOKEN=$(printf '%s' "stookwijzer:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-64)
          printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN

      - name: Worker-URL bepalen en controleren
        id: url
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          [ -n "$SUB" ] && [ "$SUB" != "null" ] || { echo "::error::Geen workers.dev-subdomein. Open eenmalig Workers & Pages in het Cloudflare-dashboard."; exit 1; }
          URL="https://$WORKER_NAME.$SUB.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in 1 2 3 4 5 6; do
            curl -fsS "$URL/health" && break
            sleep 10
          done
          echo "Worker draait op $URL"

      - name: Worker-URL in de app zetten
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          FILE=Stookwijzer/Services/PushManager.swift
          sed -i -E "s#static let serverURL = URL\(string: \"[^\"]*\"\)!#static let serverURL = URL(string: \"$URL\")!#" "$FILE"
          if git diff --quiet; then
            echo "Worker-URL stond al goed in de app"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -am "Worker-URL in app bijgewerkt"
            git push
          fi
