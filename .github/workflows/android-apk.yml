name: Android-APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK bouwen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Vaste ondertekensleutel
        # De sleutel staat versleuteld in android/signing/bekendr.jks.enc en wordt ontgrendeld met de
        # bestaande repo-secret APN_P8_CERT. Ontbreekt het bestand nog, dan wordt hij één keer aangemaakt.
        env:
          SEED: ${{ secrets.APN_P8_CERT }}
        run: |
          if [ -z "$SEED" ]; then echo "::error::De secret APN_P8_CERT ontbreekt; zonder die secret kan de vaste sleutel niet worden ontgrendeld."; exit 1; fi
          PASS=$(printf '%s' "$SEED" | sha256sum | cut -c1-40)
          echo "::add-mask::$PASS"
          F=signing/bekendr.jks.enc
          if [ ! -f "$F" ]; then
            mkdir -p signing
            keytool -genkeypair -keystore "$RUNNER_TEMP/bekendr.jks" -storetype PKCS12 -alias bekendr -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Leon van der Linden, O=LRvdLinden, C=NL" >/dev/null 2>&1
            PASS="$PASS" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/bekendr.jks" -out "$F" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$F"
            git commit -m "Android: vaste ondertekensleutel (versleuteld)"
            git pull --rebase -q origin main && git push -q origin HEAD:main
            echo "Nieuwe vaste sleutel aangemaakt en versleuteld bewaard."
          else
            PASS="$PASS" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$F" -out "$RUNNER_TEMP/bekendr.jks" -pass env:PASS
            echo "Vaste sleutel ontgrendeld."
          fi
          {
            echo "BEKENDR_KEYSTORE_PATH=$RUNNER_TEMP/bekendr.jks"
            echo "BEKENDR_KEYSTORE_PASSWORD=$PASS"
            echo "BEKENDR_KEY_ALIAS=bekendr"
            echo "BEKENDR_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
      - name: Bouwen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          # Controle: de APK moet met de vaste sleutel zijn ondertekend.
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > certs.txt
            grep -iE "certificate (DN|SHA-256)" certs.txt || cat certs.txt
          else
            echo "apksigner niet gevonden; controle overgeslagen."
          fi
      - name: Fouten als annotaties
        if: failure()
        run: |
          grep -E "^e: " build.log | sort -u | head -40 | while IFS= read -r line; do
            path=$(echo "$line" | sed -E 's|^e: file://([^:]+):([0-9]+):.*|\1|'); ln=$(echo "$line" | sed -E 's|^e: file://[^:]+:([0-9]+):.*|\1|')
            msg=$(echo "$line" | sed -E 's|^e: file://[^ ]+ ||')
            echo "::error file=${path#$GITHUB_WORKSPACE/},line=$ln::$msg"
          done
          grep -E "FAILURE|What went wrong|Could not|error:" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: APK hernoemen
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          B=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Bekendr-$V-build$B.apk"
          # Vaste naam, zodat .../releases/latest/download/Bekendr.apk altijd de nieuwste is.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Bekendr.apk"
          echo "APK=$RUNNER_TEMP/Bekendr-$V-build$B.apk" >> "$GITHUB_ENV"
          echo "APK_LATEST=$RUNNER_TEMP/Bekendr.apk" >> "$GITHUB_ENV"
          echo "VER=$V" >> "$GITHUB_ENV"; echo "BUILD=$B" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Bekendr-android
          path: ${{ env.APK }}
      - name: Downloadbare APK in Releases (nieuwste)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.VER }}-build${{ env.BUILD }}
          name: Bekendr voor Android ${{ env.VER }} (build ${{ env.BUILD }})
          body: |
            Losse APK voor Android. Download het bestand en open het op je telefoon om te installeren.
            Directe link naar altijd de nieuwste versie: https://github.com/${{ github.repository }}/releases/latest/download/Bekendr.apk
          prerelease: false
          make_latest: true
          files: |
            ${{ env.APK }}
            ${{ env.APK_LATEST }}
          overwrite_files: true
