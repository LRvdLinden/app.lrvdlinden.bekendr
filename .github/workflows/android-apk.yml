name: Android-APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: APK bouwen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ondertekensleutel klaarzetten (als de secret bestaat)
        env:
          KEYSTORE_B64: ${{ secrets.BEKENDR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bekendr.jks"
            echo "BEKENDR_KEYSTORE_PATH=$RUNNER_TEMP/bekendr.jks" >> "$GITHUB_ENV"
            echo "Eigen sleutel gebruikt."
          else
            echo "::warning::Geen BEKENDR_KEYSTORE_BASE64-secret: de APK is ondertekend met een tijdelijke sleutel. Updates over een eerdere versie heen lukken dan niet."
            keytool -genkeypair -keystore "$RUNNER_TEMP/tijdelijk.jks" -storetype PKCS12 -alias bekendr -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass tijdelijk -keypass tijdelijk -dname "CN=Bekendr tijdelijk" >/dev/null 2>&1
            {
              echo "BEKENDR_KEYSTORE_PATH=$RUNNER_TEMP/tijdelijk.jks"
              echo "BEKENDR_TEMP_KEY=1"
            } >> "$GITHUB_ENV"
          fi
      - name: Bouwen
        env:
          SECRET_STORE_PASSWORD: ${{ secrets.BEKENDR_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.BEKENDR_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.BEKENDR_KEY_PASSWORD }}
        run: |
          if [ "${BEKENDR_TEMP_KEY:-}" = "1" ]; then
            export BEKENDR_KEYSTORE_PASSWORD=tijdelijk BEKENDR_KEY_ALIAS=bekendr BEKENDR_KEY_PASSWORD=tijdelijk
          else
            export BEKENDR_KEYSTORE_PASSWORD="$SECRET_STORE_PASSWORD" BEKENDR_KEY_ALIAS="$SECRET_KEY_ALIAS" BEKENDR_KEY_PASSWORD="$SECRET_KEY_PASSWORD"
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Fouten als annotaties
        if: failure()
        run: |
          grep -E "^e: " build.log | sort -u | head -40 | while IFS= read -r line; do
            path=$(echo "$line" | sed -E 's|^e: file://([^:]+):([0-9]+):.*|\1|'); ln=$(echo "$line" | sed -E 's|^e: file://[^:]+:([0-9]+):.*|\1|')
            msg=$(echo "$line" | sed -E 's|^e: file://[^ ]+ ||')
            echo "::error file=${path#$GITHUB_WORKSPACE/},line=$ln::$msg"
          done
          grep -E "FAILURE|What went wrong|Could not|error:" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: APK hernoemen
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          B=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]//g')
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Bekendr-$V-build$B.apk"
          echo "APK=$RUNNER_TEMP/Bekendr-$V-build$B.apk" >> "$GITHUB_ENV"
          echo "VER=$V" >> "$GITHUB_ENV"; echo "BUILD=$B" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Bekendr-android
          path: ${{ env.APK }}
      - name: Downloadbare APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.VER }}-build${{ env.BUILD }}
          name: Bekendr voor Android ${{ env.VER }} (build ${{ env.BUILD }})
          body: Losse APK voor Android. Download het bestand en open het op je telefoon om te installeren.
          prerelease: true
          make_latest: false
          files: ${{ env.APK }}
          overwrite_files: true
