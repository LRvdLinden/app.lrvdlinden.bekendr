name: Apple-build

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", "*.md"]
  workflow_dispatch:

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Bouwen (${{ matrix.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: "generic/platform=iOS Simulator"
          - name: macOS
            destination: "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v5
      - name: Xcode kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Bouwen zonder ondertekening
        run: |
          set -o pipefail
          xcodebuild -project Bekendr.xcodeproj -scheme Bekendr \
            -destination "${{ matrix.destination }}" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Fouten als annotaties
        if: failure()
        run: |
          grep -E "^/.*: error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|$GITHUB_WORKSPACE/||"); ln=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5- )
            echo "::error file=$file,line=$ln::$msg"
          done
          grep -E "error:" build.log | grep -v "^/" | sort -u | head -20 | while IFS= read -r line; do echo "::error::$line"; done
